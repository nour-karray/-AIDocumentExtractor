[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"] # Existing OCR prompts and regular expressions are intentionally long.

[tool.ruff.lint.per-file-ignores]
# These executable entry points bootstrap the repository root before local imports.
"backend/app/core.py" = ["E402"]
"pipelines/run_medical_extraction.py" = ["E402"]
"pipelines/run_pipeline.py" = ["E402"]
"pipelines/run_steg_extraction.py" = ["E402"]
"scripts/cleanup_production_history.py" = ["E402"]
"src/main.py" = ["E402"]
"tests/test_document_router_hints.py" = ["E402"]
